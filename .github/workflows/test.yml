name: test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PySide6 and the system libraries Qt loads
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libglib2.0-0t64 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install PySide6-Essentials
      # called directly rather than via ./install.sh test, which skips the tray test when PySide6 is missing
      - run: python plasmoid/contents/code/fetch.py --selftest
      - run: python usage_tray.py --selftest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Lint install.sh
        run: shellcheck install.sh
